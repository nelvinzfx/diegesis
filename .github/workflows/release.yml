name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ./release.keystore

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          # Print the signing certificate; fails if the APK is unsigned.
          keytool -printcert -jarfile "$APK"
          # The certificate must be the release key, not the pinned debug key:
          # compare SHA256 fingerprints against the repo's debug.keystore.
          DEBUG_FP=$(keytool -list -keystore debug.keystore -storepass android -alias diegesis-debug 2>/dev/null \
            | grep -o 'SHA256:.*' || true)
          APK_FP=$(keytool -printcert -jarfile "$APK" | grep -o 'SHA256:.*' | head -1)
          echo "debug keystore fp: $DEBUG_FP"
          echo "apk signing fp:    $APK_FP"
          if [ -n "$DEBUG_FP" ] && [ "$APK_FP" = "$DEBUG_FP" ]; then
            echo "::error::APK is signed with the DEBUG key — release signing did not apply"
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd app/build/outputs/apk/release
          cp app-release.apk diegesis-${{ inputs.tag }}.apk
          sha256sum diegesis-${{ inputs.tag }}.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diegesis-release-apk
          path: |
            app/build/outputs/apk/release/diegesis-${{ inputs.tag }}.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --generate-notes \
            --title "Diegesis ${{ inputs.tag }}" \
            app/build/outputs/apk/release/diegesis-${{ inputs.tag }}.apk \
            app/build/outputs/apk/release/SHA256SUMS
